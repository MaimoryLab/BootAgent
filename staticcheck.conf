# ST1005 requires lowercase, unpunctuated error strings. OneAgent's error
# messages are user-facing product copy shown in the wizard and printed by the
# CLI, and they must stay byte-identical to the established public messages
# during the Wails migration. Rewriting them to satisfy a Go style convention
# would change what users read, so the check is off for this module.
checks = ["all", "-ST1005"]
