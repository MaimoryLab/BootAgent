name: Release Candidate Verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-build-and-agent-install:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: Linux x64
            source: "--source"
          - os: windows-2022
            label: Windows x64
            source: ""
          - os: macos-15
            label: macOS arm64
            source: ""
          - os: macos-15-intel
            label: macOS x64
            source: ""
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache-dependency-path: go.sum

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run test:coverage
          npm run build

      - name: Run Go contracts
        run: go test ./...

      - name: Build unsigned native package
        shell: bash
        run: go run ./cmd/oneagent-release build --channel technical-preview-unsigned --skip-frontend ${{ matrix.source }}

      - name: Build headless Go CLI
        shell: bash
        run: |
          mkdir -p bin
          if [ "$RUNNER_OS" = "Windows" ]; then
            go build -o bin/oneagent.exe ./cmd/oneagent
          else
            go build -o bin/oneagent ./cmd/oneagent
          fi

      - name: Smoke packaged executable on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          home_dir="$(mktemp -d)"
          archive="$(find release -maxdepth 1 -name 'OneAgent-*.zip' ! -name '*-source.zip' -print -quit)"
          package_dir="$(mktemp -d)"
          unzip -q "$archive" -d "$package_dir"
          "$package_dir/OneAgent/oneagent" --agent openclaw --check-agent-only --json --home "$home_dir"

      - name: Real macOS cleanroom
        if: runner.os == 'macOS'
        run: bash tests/macos_cleanroom_test.sh

      - name: Smoke packaged executable on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $homeDir = Join-Path $env:RUNNER_TEMP "oneagent-package-home"
          $archive = Get-ChildItem release\OneAgent-*.zip | Where-Object { $_.Name -notlike "*-source.zip" } | Select-Object -First 1
          $packageDir = Join-Path $env:RUNNER_TEMP "oneagent-package"
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath $packageDir -Force
          & (Join-Path $packageDir "OneAgent\oneagent.exe") --agent openclaw --check-agent-only --json --home $homeDir

      - name: Install and verify all locked Agents
        run: go run ./cmd/oneagent-rc verify-agents

      - name: Verify a blank machine can run Codex and Claude Code
        if: runner.os != 'Windows'
        shell: bash
        run: bash tests/real_install_test.sh

      - name: Verify configured Agents adopt their config without a key
        if: runner.os != 'Windows'
        run: go run ./cmd/oneagent-rc adopted

      - name: Upload blank-machine verification failures
        if: failure() && runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: real-install-${{ matrix.os }}
          path: build/real-install
          if-no-files-found: ignore

      - name: Validate release contents
        run: go run ./cmd/oneagent-release check release

      - name: Upload macOS cleanroom failures
        if: failure() && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: macos-cleanroom-failures-${{ matrix.os }}
          path: build/macos-cleanroom
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: OneAgent-${{ matrix.os }}-release-candidate-unsigned
          path: release/*
          if-no-files-found: error

  provider-protocol-smoke:
    name: PPIO and Novita protocol smoke
    needs: native-build-and-agent-install
    runs-on: ubuntu-22.04
    env:
      ONEAGENT_PPIO_API_KEY: ${{ secrets.ONEAGENT_PPIO_API_KEY }}
      ONEAGENT_PPIO_OPENAI_MODEL: ${{ vars.ONEAGENT_PPIO_OPENAI_MODEL }}
      ONEAGENT_PPIO_ANTHROPIC_MODEL: ${{ vars.ONEAGENT_PPIO_ANTHROPIC_MODEL }}
      ONEAGENT_PPIO_RESPONSES_MODEL: ${{ vars.ONEAGENT_PPIO_RESPONSES_MODEL }}
      ONEAGENT_NOVITA_API_KEY: ${{ secrets.ONEAGENT_NOVITA_API_KEY }}
      ONEAGENT_NOVITA_OPENAI_MODEL: ${{ vars.ONEAGENT_NOVITA_OPENAI_MODEL }}
      ONEAGENT_NOVITA_ANTHROPIC_MODEL: ${{ vars.ONEAGENT_NOVITA_ANTHROPIC_MODEL }}
      ONEAGENT_NOVITA_RESPONSES_MODEL: ${{ vars.ONEAGENT_NOVITA_RESPONSES_MODEL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache-dependency-path: go.sum

      - name: Run low-token protocol checks
        run: go run ./cmd/oneagent-provider-smoke --provider all --timeout 30s
