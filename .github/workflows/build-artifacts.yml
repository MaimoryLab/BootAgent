name: Build artifacts

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example v0.3.0)
        required: true
        type: string
        default: v0.0.0

permissions:
  contents: read

env:
  RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

concurrency:
  group: build-artifacts-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - name: Validate release version
        shell: bash
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version must match vX.Y.Z" >&2
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: pnpm/setup@v2
        with:
          package-json-file: frontend/package.json
          runtime: node@26
          cache: true
          cache-dependency-path: frontend/pnpm-lock.yaml
          install: false

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: frontend
        run: pnpm run build

      - name: Upload frontend
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error

  build:
    needs: frontend
    name: Build ${{ matrix.target.platform }} ${{ matrix.arch.label }}
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - platform: macos
            runner: macos-latest
            cgo: 1
            suffix: ""
            desktop_ldflags: -w -s
          - platform: windows
            runner: windows-latest
            cgo: 0
            suffix: .exe
            desktop_ldflags: -w -s -H windowsgui
        arch:
          - {label: x64, goarch: amd64, ota: amd64}
          - {label: arm64, goarch: arm64, ota: arm64}

    env:
      CGO_ENABLED: ${{ matrix.target.cgo }}
      CGO_CFLAGS: ${{ matrix.target.platform == 'macos' && '-mmacosx-version-min=12.0' || '' }}
      CGO_LDFLAGS: ${{ matrix.target.platform == 'macos' && '-mmacosx-version-min=12.0' || '' }}
      GOARCH: ${{ matrix.arch.goarch }}
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.target.platform == 'macos' && '12.0' || '' }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Download frontend
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Build binaries
        shell: bash
        run: |
          mkdir -p bin
          version_ldflag="-X github.com/MaimoryLab/OneAgent/internal/version.Version=$RELEASE_VERSION"
          if [ "${{ matrix.target.platform }}" = windows ]; then
            go run github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.4 generate icons -input build/appicon.png -macfilename "" -windowsfilename build/windows/icon.ico
            go run github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.4 generate syso -arch "${GOARCH}" -icon build/windows/icon.ico -manifest build/windows/wails.exe.manifest -out "cmd/oneagent-desktop/wails_windows_${GOARCH}.syso"
          fi
          go build -tags wails,production -trimpath -buildvcs=false -ldflags="${{ matrix.target.desktop_ldflags }} $version_ldflag" -o "bin/oneagent-desktop${{ matrix.target.suffix }}" ./cmd/oneagent-desktop
          rm -f "cmd/oneagent-desktop/wails_windows_${GOARCH}.syso"

      - name: Package macOS app
        if: matrix.target.platform == 'macos'
        shell: bash
        run: |
          mkdir -p "bin/OneAgent.app/Contents/MacOS" "bin/OneAgent.app/Contents/Resources"
          cp "bin/oneagent-desktop" "bin/OneAgent.app/Contents/MacOS/oneagent-desktop"
          cp build/darwin/icons.icns "bin/OneAgent.app/Contents/Resources/icons.icns"
          cp build/darwin/Info.plist "bin/OneAgent.app/Contents/Info.plist"
          bundle_version="${RELEASE_VERSION#v}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $bundle_version" "bin/OneAgent.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $bundle_version" "bin/OneAgent.app/Contents/Info.plist"
          codesign --force --deep --sign - "bin/OneAgent.app"
          rm "bin/oneagent-desktop"

      - name: Package macOS DMG
        if: matrix.target.platform == 'macos'
        shell: bash
        run: |
          hdiutil create \
            -volname OneAgent \
            -srcfolder "bin/OneAgent.app" \
            -ov \
            -format UDZO \
            "bin/OneAgent-darwin-${{ matrix.arch.ota }}.dmg"

      - name: Install NSIS
        if: matrix.target.platform == 'windows'
        uses: repolevedavaj/install-nsis@v1.2.1
        with:
          nsis-version: '3.12'

      - name: Package Windows NSIS installer
        if: matrix.target.platform == 'windows'
        shell: pwsh
        run: |
          go run github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.4 generate webview2bootstrapper -dir "$env:GITHUB_WORKSPACE/build/windows/nsis"
          $version = $env:RELEASE_VERSION.TrimStart('v')
          $arch = '${{ matrix.arch.ota }}'
          Set-Location "$env:GITHUB_WORKSPACE/build/windows/nsis"
          makensis "-DINFO_PRODUCTVERSION=$version" "-DARG_WAILS_${{ matrix.arch.goarch == 'amd64' && 'AMD64' || 'ARM64' }}_BINARY=$env:GITHUB_WORKSPACE\bin\oneagent-desktop.exe" project.nsi
          Rename-Item "..\..\..\bin\oneagent-desktop-$arch-installer.exe" "OneAgent-windows-$arch-installer.exe"

      - name: Package macOS OTA archive
        if: matrix.target.platform == 'macos'
        shell: bash
        run: |
          (cd bin && zip -qry "OneAgent-darwin-${{ matrix.arch.ota }}.zip" OneAgent.app)
          roots="$(unzip -Z1 "bin/OneAgent-darwin-${{ matrix.arch.ota }}.zip" | awk -F/ 'NF {print $1}' | sort -u)"
          test "$roots" = OneAgent.app

      - name: Package Windows OTA archive
        if: matrix.target.platform == 'windows'
        shell: pwsh
        run: |
          $archive = "bin/OneAgent-windows-${{ matrix.arch.ota }}.zip"
          Compress-Archive -Path "bin/oneagent-desktop.exe" -DestinationPath $archive
          $roots = @(tar -tf $archive | ForEach-Object { ($_ -split '/')[0] } | Where-Object { $_ } | Sort-Object -Unique)
          if ($roots.Count -ne 1 -or $roots[0] -ne "oneagent-desktop.exe") {
            throw "unexpected OTA archive roots: $($roots -join ', ')"
          }

      - name: Upload OTA archive
        uses: actions/upload-artifact@v7
        with:
          name: ota-${{ matrix.target.platform }}-${{ matrix.arch.label }}
          path: bin/OneAgent-${{ matrix.target.platform == 'macos' && 'darwin' || 'windows' }}-${{ matrix.arch.ota }}.zip
          if-no-files-found: error

      - name: Upload macOS DMG
        if: matrix.target.platform == 'macos'
        uses: actions/upload-artifact@v7
        with:
          name: installer-macos-${{ matrix.arch.label }}
          path: bin/OneAgent-darwin-${{ matrix.arch.ota }}.dmg
          if-no-files-found: error

      - name: Upload Windows NSIS installer
        if: matrix.target.platform == 'windows'
        uses: actions/upload-artifact@v7
        with:
          name: installer-windows-${{ matrix.arch.label }}
          path: bin/OneAgent-windows-${{ matrix.arch.ota }}-installer.exe
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    name: Publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download OTA archives
        uses: actions/download-artifact@v8
        with:
          pattern: ota-*
          path: release-assets
          merge-multiple: true

      - name: Download macOS DMGs
        uses: actions/download-artifact@v8
        with:
          pattern: installer-macos-*
          path: release-assets
          merge-multiple: true

      - name: Download Windows NSIS installers
        uses: actions/download-artifact@v8
        with:
          pattern: installer-windows-*
          path: release-assets
          merge-multiple: true

      - name: Validate and publish release
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            OneAgent-darwin-amd64.zip
            OneAgent-darwin-arm64.zip
            OneAgent-darwin-amd64.dmg
            OneAgent-darwin-arm64.dmg
            OneAgent-windows-amd64.zip
            OneAgent-windows-arm64.zip
            OneAgent-windows-amd64-installer.exe
            OneAgent-windows-arm64-installer.exe
          )
          mapfile -t assets < <(find release-assets -maxdepth 1 -type f -name 'OneAgent-*' -printf '%f\n' | sort)
          test "${#assets[@]}" -eq 8
          diff <(printf '%s\n' "${expected[@]}" | sort) <(printf '%s\n' "${assets[@]}")
          (cd release-assets && sha256sum OneAgent-* > SHA256SUMS)
          test "$(wc -l < release-assets/SHA256SUMS)" -eq 8

          if gh release view "$RELEASE_VERSION" >/dev/null 2>&1; then
            gh release upload "$RELEASE_VERSION" release-assets/* --clobber
            gh release edit "$RELEASE_VERSION" --draft=false --prerelease=false
          else
            gh release create "$RELEASE_VERSION" release-assets/* --verify-tag --title "$RELEASE_VERSION" --generate-notes
          fi
