name: Build artifacts

on:
  workflow_dispatch:
    inputs:
      codesign:
        description: Sign macOS apps (requires APPLE_* secrets)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.17.0

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: frontend
        run: pnpm run build

      - name: Upload frontend
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error

  build:
    needs: frontend
    name: Build ${{ matrix.target.platform }} ${{ matrix.arch }}
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - platform: macos
            runner: macos-latest
            cgo: 1
            suffix: ""
            desktop_ldflags: -w -s
          - platform: windows
            runner: windows-latest
            cgo: 0
            suffix: .exe
            desktop_ldflags: -w -s -H windowsgui
        arch: [x64, arm64]

    env:
      CGO_ENABLED: ${{ matrix.target.cgo }}
      CGO_CFLAGS: ${{ matrix.target.platform == 'macos' && '-mmacosx-version-min=12.0' || '' }}
      CGO_LDFLAGS: ${{ matrix.target.platform == 'macos' && '-mmacosx-version-min=12.0' || '' }}
      GOARCH: ${{ matrix.arch == 'x64' && 'amd64' || 'arm64' }}
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.target.platform == 'macos' && '12.0' || '' }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Download frontend
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Build binaries
        shell: bash
        run: |
          mkdir -p bin
          go build -tags wails,production -trimpath -buildvcs=false -ldflags="${{ matrix.target.desktop_ldflags }}" -o "bin/oneagent-desktop${{ matrix.target.suffix }}" ./cmd/oneagent-desktop
          go build -trimpath -buildvcs=false -ldflags="-w -s" -o "bin/oneagent${{ matrix.target.suffix }}" ./cmd/oneagent

      - name: Package macOS app
        if: matrix.target.platform == 'macos'
        shell: bash
        run: |
          app="bin/OneAgent.app"
          plist="$app/Contents/Info.plist"
          mkdir -p "$app/Contents/MacOS"
          mv bin/oneagent-desktop "$app/Contents/MacOS/OneAgent"
          plutil -create xml1 "$plist"
          plutil -insert CFBundleDisplayName -string OneAgent "$plist"
          plutil -insert CFBundleExecutable -string OneAgent "$plist"
          plutil -insert CFBundleIdentifier -string com.maimorylab.oneagent "$plist"
          plutil -insert CFBundleName -string OneAgent "$plist"
          plutil -insert CFBundlePackageType -string APPL "$plist"
          plutil -insert CFBundleShortVersionString -string 0.3.0 "$plist"
          plutil -insert CFBundleVersion -string "${{ github.run_number }}" "$plist"
          plutil -insert LSMinimumSystemVersion -string 12.0 "$plist"
          plutil -insert NSHighResolutionCapable -bool true "$plist"

      # - name: Sign macOS app
      #   if: matrix.target.platform == 'macos' && inputs.codesign
      #   shell: bash
      #   env:
      #     APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      #     APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      #     APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      #   run: |
      #     test -n "$APPLE_CERTIFICATE_BASE64"
      #     test -n "$APPLE_CERTIFICATE_PASSWORD"
      #     test -n "$APPLE_SIGNING_IDENTITY"
      #     certificate="$RUNNER_TEMP/signing.p12"
      #     keychain="$RUNNER_TEMP/signing.keychain-db"
      #     keychain_password="$(openssl rand -hex 24)"
      #     printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$certificate"
      #     security create-keychain -p "$keychain_password" "$keychain"
      #     security unlock-keychain -p "$keychain_password" "$keychain"
      #     security import "$certificate" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
      #     security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain"
      #     security list-keychains -d user -s "$keychain"
      #     codesign --force --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" bin/OneAgent.app
      #     codesign --verify --deep --strict --verbose=2 bin/OneAgent.app

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: OneAgent-${{ matrix.target.platform }}-${{ matrix.arch }}
          path: bin/*
          if-no-files-found: error
          compression-level: 0
