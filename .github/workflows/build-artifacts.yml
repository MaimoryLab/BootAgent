name: Build artifacts

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example v0.3.0)
        required: true
        type: string
        default: v0.0.0

permissions:
  contents: read

env:
  RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

concurrency:
  group: build-artifacts-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - name: Validate release version
        shell: bash
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version must match vX.Y.Z" >&2
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: pnpm/setup@v2
        with:
          package-json-file: frontend/package.json
          runtime: node@26
          cache: true
          cache-dependency-path: frontend/pnpm-lock.yaml
          install: false

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: frontend
        run: pnpm run build

      - name: Upload frontend
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error

  macos:
    needs: frontend
    name: Build macOS ${{ matrix.arch.label }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - {label: x64, goarch: amd64, ota: amd64}
          - {label: arm64, goarch: arm64, ota: arm64}

    env:
      CGO_ENABLED: 1
      CGO_CFLAGS: -mmacosx-version-min=12.0
      CGO_LDFLAGS: -mmacosx-version-min=12.0
      GOARCH: ${{ matrix.arch.goarch }}
      MACOSX_DEPLOYMENT_TARGET: '12.0'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Download frontend
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Build macOS binary
        shell: bash
        run: |
          mkdir -p bin
          version_ldflag="-X github.com/MaimoryLab/OneAgent/internal/version.Version=$RELEASE_VERSION"
          go build -tags wails,production -trimpath -buildvcs=false -ldflags="-w -s $version_ldflag" -o bin/oneagent-desktop ./cmd/oneagent-desktop

      - name: Package macOS app
        shell: bash
        run: |
          mkdir -p "bin/OneAgent.app/Contents/MacOS" "bin/OneAgent.app/Contents/Resources"
          cp "bin/oneagent-desktop" "bin/OneAgent.app/Contents/MacOS/oneagent-desktop"
          cp build/darwin/icons.icns "bin/OneAgent.app/Contents/Resources/icons.icns"
          cp build/darwin/Info.plist "bin/OneAgent.app/Contents/Info.plist"
          bundle_version="${RELEASE_VERSION#v}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $bundle_version" "bin/OneAgent.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $bundle_version" "bin/OneAgent.app/Contents/Info.plist"
          codesign --force --deep --sign - "bin/OneAgent.app"
          rm "bin/oneagent-desktop"

      - name: Package macOS DMG
        shell: bash
        run: |
          # Staged through a directory rather than pointing -srcfolder at the
          # bundle: the volume needs an /Applications symlink beside the app so
          # users have somewhere to drag it. Without one the window shows a lone
          # icon, and running the app from the mounted image is the natural
          # reaction -- which Gatekeeper answers with App Translocation, putting
          # the bundle on a read-only volume where self-update cannot back it up
          # and silently gives up (#143).
          rm -rf bin/dmg-root
          mkdir -p bin/dmg-root
          cp -R "bin/OneAgent.app" bin/dmg-root/
          ln -s /Applications bin/dmg-root/Applications
          hdiutil create \
            -volname OneAgent \
            -srcfolder bin/dmg-root \
            -ov \
            -format UDZO \
            "bin/OneAgent-darwin-${{ matrix.arch.ota }}.dmg"
          rm -rf bin/dmg-root

      - name: Verify macOS DMG layout
        shell: bash
        run: |
          # A dmg that lost the symlink still installs, so nothing downstream
          # would fail -- the regression would ship silently and only show up as
          # users running the app from the image.
          dmg="bin/OneAgent-darwin-${{ matrix.arch.ota }}.dmg"
          mountpoint="$(mktemp -d)"
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mountpoint"
          status=0
          test -d "$mountpoint/OneAgent.app" || { echo "OneAgent.app missing from dmg" >&2; status=1; }
          test -L "$mountpoint/Applications" || { echo "Applications symlink missing from dmg" >&2; status=1; }
          # Must be absolute: a relative link resolves against the mounted
          # volume on the user's machine, where it points at nothing.
          target="$(readlink "$mountpoint/Applications" || true)"
          test "$target" = /Applications || { echo "Applications links to '$target', want /Applications" >&2; status=1; }
          hdiutil detach "$mountpoint"
          exit "$status"

      - name: Package macOS OTA archive
        shell: bash
        run: |
          (cd bin && zip -qry "ota-OneAgent-darwin-${{ matrix.arch.ota }}.zip" OneAgent.app)
          roots="$(unzip -Z1 "bin/ota-OneAgent-darwin-${{ matrix.arch.ota }}.zip" | awk -F/ 'NF {print $1}' | sort -u)"
          test "$roots" = OneAgent.app

      - name: Upload OTA archive
        uses: actions/upload-artifact@v7
        with:
          name: ota-macos-${{ matrix.arch.label }}
          path: bin/ota-OneAgent-darwin-${{ matrix.arch.ota }}.zip
          if-no-files-found: error

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v7
        with:
          name: installer-macos-${{ matrix.arch.label }}
          path: bin/OneAgent-darwin-${{ matrix.arch.ota }}.dmg
          if-no-files-found: error

  windows:
    needs: frontend
    name: Build Windows ${{ matrix.arch.label }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - {label: x64, goarch: amd64, ota: amd64}
          - {label: arm64, goarch: arm64, ota: arm64}

    env:
      CGO_ENABLED: 0
      GOARCH: ${{ matrix.arch.goarch }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Download frontend
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Compile Windows resources
        shell: bash
        working-directory: build
        run: |
          version="${RELEASE_VERSION#v}"
          sed "s/0.0.0/${version}/g" windows/info.json > windows/info.generated.json
          GOARCH=amd64 go run github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.7 generate syso \
            -icon windows/icon.ico \
            -manifest windows/wails.exe.manifest \
            -info windows/info.generated.json \
            -arch "$GOARCH" \
            -out "../cmd/oneagent-desktop/rsrc_windows_${GOARCH}.syso"

      - name: Build Windows binary
        shell: bash
        run: |
          mkdir -p bin
          version_ldflag="-X github.com/MaimoryLab/OneAgent/internal/version.Version=$RELEASE_VERSION"
          go build -tags wails,production -trimpath -buildvcs=false -ldflags="-w -s -H windowsgui $version_ldflag" -o bin/oneagent-desktop.exe ./cmd/oneagent-desktop
          rm -f "cmd/oneagent-desktop/rsrc_windows_${GOARCH}.syso" build/windows/info.generated.json

      - name: Install NSIS
        uses: repolevedavaj/install-nsis@v1.2.1
        with:
          nsis-version: '3.12'

      - name: Package Windows NSIS installer
        shell: pwsh
        run: |
          $env:GOARCH = 'amd64'
          go run github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.7 generate webview2bootstrapper -dir "$env:GITHUB_WORKSPACE/build/windows/nsis"
          $version = $env:RELEASE_VERSION.TrimStart('v')
          $arch = '${{ matrix.arch.ota }}'
          Set-Location "$env:GITHUB_WORKSPACE/build/windows/nsis"
          makensis "-DINFO_PRODUCTVERSION=$version" "-DARG_WAILS_${{ matrix.arch.goarch == 'amd64' && 'AMD64' || 'ARM64' }}_BINARY=$env:GITHUB_WORKSPACE\bin\oneagent-desktop.exe" project.nsi
          Rename-Item "..\..\..\bin\oneagent-desktop-$arch-installer.exe" "OneAgent-windows-$arch-installer.exe"

      - name: Package Windows OTA archive
        shell: pwsh
        run: |
          $archive = "bin/ota-OneAgent-windows-${{ matrix.arch.ota }}.zip"
          Compress-Archive -Path "bin/oneagent-desktop.exe" -DestinationPath $archive
          $roots = @(tar -tf $archive | ForEach-Object { ($_ -split '/')[0] } | Where-Object { $_ } | Sort-Object -Unique)
          if ($roots.Count -ne 1 -or $roots[0] -ne "oneagent-desktop.exe") {
            throw "unexpected OTA archive roots: $($roots -join ', ')"
          }

      - name: Upload OTA archive
        uses: actions/upload-artifact@v7
        with:
          name: ota-windows-${{ matrix.arch.label }}
          path: bin/ota-OneAgent-windows-${{ matrix.arch.ota }}.zip
          if-no-files-found: error

      - name: Upload Windows NSIS installer
        uses: actions/upload-artifact@v7
        with:
          name: installer-windows-${{ matrix.arch.label }}
          path: bin/OneAgent-windows-${{ matrix.arch.ota }}-installer.exe
          if-no-files-found: error

  linux:
    needs: frontend
    name: Build Linux ${{ matrix.arch.label }}
    runs-on: ${{ matrix.arch.runner }}
    strategy:
      fail-fast: false
      matrix:
        arch:
          - {label: x64, goarch: amd64, ota: amd64, runner: ubuntu-24.04}
          - {label: arm64, goarch: arm64, ota: arm64, runner: ubuntu-24.04-arm}

    env:
      CGO_ENABLED: 1
      GOARCH: ${{ matrix.arch.goarch }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Download frontend
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Install GTK4 build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev

      - name: Build GTK4 Linux binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bin
          version_ldflag="-X github.com/MaimoryLab/OneAgent/internal/version.Version=$RELEASE_VERSION"
          go build -tags wails,production -trimpath -buildvcs=false \
            -ldflags="-w -s $version_ldflag" \
            -o bin/oneagent-desktop ./cmd/oneagent-desktop
          file bin/oneagent-desktop
          expected_arch='${{ matrix.arch.goarch == 'amd64' && 'x86-64' || 'ARM aarch64' }}'
          file bin/oneagent-desktop | grep -F "$expected_arch"

      - name: Generate Linux packages
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION#v}"
          export VERSION="$version"
          desktop="build/linux/oneagent-desktop.desktop"
          appimage_arch='${{ matrix.arch.goarch == 'amd64' && 'x86_64' || 'aarch64' }}'
          package_arch='${{ matrix.arch.ota }}'

          go run github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.7 \
            generate .desktop \
            -name OneAgent \
            -exec oneagent-desktop \
            -icon appicon \
            -outputfile "$desktop" \
            -categories 'Development;' \
            -comment 'Local AI development environment activator'

          go run github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.7 \
            generate appimage \
            -binary bin/oneagent-desktop \
            -icon build/appicon.png \
            -desktopfile "$desktop" \
            -outputdir bin \
            -builddir build/linux/appimage/build
          mv "bin/oneagent-desktop-${appimage_arch}.AppImage" "bin/OneAgent-linux-${package_arch}.AppImage"

          go run github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.7 \
            tool package \
            -name oneagent-desktop \
            -format deb \
            -config build/linux/nfpm/nfpm.yaml \
            -out bin
          test -s bin/oneagent-desktop.deb
          mv bin/oneagent-desktop.deb "bin/OneAgent-linux-${package_arch}.deb"

          go run github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.7 \
            tool package \
            -name oneagent-desktop \
            -format rpm \
            -config build/linux/nfpm/nfpm.yaml \
            -out bin
          test -s bin/oneagent-desktop.rpm
          mv bin/oneagent-desktop.rpm "bin/OneAgent-linux-${package_arch}.rpm"

          (cd bin && zip -q "ota-OneAgent-linux-${package_arch}.zip" oneagent-desktop)
          roots="$(unzip -Z1 "bin/ota-OneAgent-linux-${package_arch}.zip" | awk -F/ 'NF {print $1}' | sort -u)"
          test "$roots" = oneagent-desktop

      - name: Verify Linux package outputs
        shell: bash
        run: |
          set -euo pipefail
          arch='${{ matrix.arch.ota }}'
          test -x bin/OneAgent-linux-${arch}.AppImage
          test -s bin/OneAgent-linux-${arch}.deb
          test -s bin/OneAgent-linux-${arch}.rpm
          test -s bin/ota-OneAgent-linux-${arch}.zip
          test "$(unzip -Z1 bin/ota-OneAgent-linux-${arch}.zip | awk -F/ 'NF {print $1}' | sort -u)" = oneagent-desktop

      - name: Upload Linux packages
        uses: actions/upload-artifact@v7
        with:
          name: installer-linux-${{ matrix.arch.label }}
          path: |
            bin/OneAgent-linux-${{ matrix.arch.ota }}.AppImage
            bin/OneAgent-linux-${{ matrix.arch.ota }}.deb
            bin/OneAgent-linux-${{ matrix.arch.ota }}.rpm
            bin/ota-OneAgent-linux-${{ matrix.arch.ota }}.zip
          if-no-files-found: error

  release:
    needs: [macos, windows, linux]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    name: Publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download OTA archives
        uses: actions/download-artifact@v8
        with:
          pattern: ota-*
          path: release-assets
          merge-multiple: true

      - name: Download macOS DMGs
        uses: actions/download-artifact@v8
        with:
          pattern: installer-macos-*
          path: release-assets
          merge-multiple: true

      - name: Download Windows NSIS installers
        uses: actions/download-artifact@v8
        with:
          pattern: installer-windows-*
          path: release-assets
          merge-multiple: true

      - name: Download Linux packages
        uses: actions/download-artifact@v8
        with:
          pattern: installer-linux-*
          path: release-assets
          merge-multiple: true

      - name: Validate and publish release
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            ota-OneAgent-darwin-amd64.zip
            ota-OneAgent-darwin-arm64.zip
            OneAgent-darwin-amd64.dmg
            OneAgent-darwin-arm64.dmg
            ota-OneAgent-windows-amd64.zip
            ota-OneAgent-windows-arm64.zip
            OneAgent-windows-amd64-installer.exe
            OneAgent-windows-arm64-installer.exe
            OneAgent-linux-amd64.AppImage
            OneAgent-linux-arm64.AppImage
            OneAgent-linux-amd64.deb
            OneAgent-linux-arm64.deb
            OneAgent-linux-amd64.rpm
            OneAgent-linux-arm64.rpm
            ota-OneAgent-linux-amd64.zip
            ota-OneAgent-linux-arm64.zip
          )
          mapfile -t assets < <(find release-assets -maxdepth 1 -type f -name 'OneAgent-*' -printf '%f\n' | sort)
          test "${#assets[@]}" -eq 16
          diff <(printf '%s\n' "${expected[@]}" | sort) <(printf '%s\n' "${assets[@]}")
          (cd release-assets && sha256sum OneAgent-* > SHA256SUMS)
          test "$(wc -l < release-assets/SHA256SUMS)" -eq 16

          if gh release view "$RELEASE_VERSION" >/dev/null 2>&1; then
            gh release upload "$RELEASE_VERSION" release-assets/* --clobber
            gh release edit "$RELEASE_VERSION" --draft=false --prerelease=false
          else
            gh release create "$RELEASE_VERSION" release-assets/* --verify-tag --title "$RELEASE_VERSION" --generate-notes
          fi

      # The public site reads this release's assets — filenames, sizes and digests —
      # from the API at build time, because its CSP forbids a browser-side call to
      # api.github.com. That makes its download page only as current as its last
      # deploy, so without this it keeps advertising the previous version until a
      # scheduled build happens to run.
      #
      # Deliberately after the step above rather than a separate job: the site needs
      # to know the assets are *uploaded*, not that a tag exists. A build that read
      # the feed mid-upload would publish a partial asset list, which is worse than
      # publishing a stale complete one.
      #
      # Failure here does not fail the release. The release is the product; telling
      # a website about it is not, and the site's own twelve-hour schedule is the
      # backstop. `|| true` keeps a token that expired from turning a good release
      # red.
      - name: Notify the public site
        if: env.SITE_DISPATCH_TOKEN != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
          SITE_DISPATCH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          gh api repos/MaimoryLab/OneAgent-site/dispatches \
            -f event_type=upstream-release \
            -F "client_payload[release]=$RELEASE_VERSION" || true
