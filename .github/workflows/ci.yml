name: CI

on:
  # Automatic runs are off at the repository owner's request. The jobs below are
  # unchanged and still run on demand from the Actions tab, so restoring
  # continuous checks means putting the pull_request and push triggers back --
  # nothing else here has to change.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  container-cleanroom:
    name: Docker Linux cleanroom
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Build and run isolated Linux cleanroom
        run: bash scripts/test_docker_cleanroom.sh

      - name: Upload cleanroom evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-linux-cleanroom
          path: build/docker-cleanroom
          if-no-files-found: ignore

  contract-and-browser:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: Linux x64
          - os: windows-2022
            label: Windows x64
          - os: macos-15
            label: macOS arm64
          - os: macos-15-intel
            label: macOS x64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The Go core is being ported from Python one package at a time. Both
      # implementations are checked on every platform until the Python one is
      # removed, so a divergence fails here rather than after the switch.
      # go.mod rather than go.sum: the core has no third-party dependencies yet,
      # so go.sum does not exist and naming it would fail the cache step.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"
          cache-dependency-path: desktop/go.mod

      - name: Install Python test tools
        run: python -m pip install coverage==7.15.2

      - name: Install macOS packaging tool
        if: runner.os == 'macOS'
        run: python -m pip install pyinstaller==6.21.0

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Python contracts and coverage
        shell: bash
        run: |
          mkdir -p build/coverage
          coverage erase
          coverage run --branch -m unittest tests.test_core tests.test_cli tests.test_server tests.test_release_policy tests.test_distribution_data tests.test_edge_cases tests.test_rc_scripts tests.test_install_contract tests.test_config_discovery
          coverage report --fail-under=85
          coverage json
          python -c "import json, os; files = json.load(open('build/coverage/coverage.json', encoding='utf-8'))['files']; normalized = {key.replace(os.sep, '/'): value for key, value in files.items()}; summary = normalized['oneagent/installer.py']['summary']; assert summary['percent_branches_covered'] == 100 and summary['num_partial_branches'] == 0, summary"

      # -race because Wails runs each binding call in its own goroutine, so the
      # core will be reached concurrently once the desktop shell lands. Finding
      # that out at that point would be too late.
      - name: Go core contracts
        working-directory: desktop
        run: |
          go vet ./...
          go test -race -cover ./...

      # Exit codes and home resolution are external contracts, and two
      # implementations now claim to honour them. These tests read the Python
      # source and compare, so a divergence on either side fails here.
      #
      # internal/parity runs first and is not filtered: `go test -run` exits 0
      # when its pattern matches nothing, so a deleted parity file would make
      # the filtered step below pass while testing nothing. The gate checks from
      # outside that each parity file still exists and still carries its tests.
      - name: Go and Python cross-language parity
        working-directory: desktop
        # The home comparison shells out to Python and would otherwise skip if
        # the interpreter were missing -- another way for a gate to retire
        # quietly. This makes that a failure on CI while leaving the skip in
        # place for a developer machine without Python.
        env:
          ONEAGENT_REQUIRE_PARITY: "1"
        run: |
          go test ./internal/parity/ -v -count=1
          go test ./internal/oerr/ ./internal/runtime/ -run TestParity -v -count=1

      - name: Bash compatibility contracts
        if: runner.os != 'Windows'
        run: bash tests/install_test.sh

      - name: GUI compatibility smoke
        if: runner.os != 'Windows'
        run: python tests/gui_smoke_test.py

      - name: PowerShell wrapper contract
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $homeDir = Join-Path $env:RUNNER_TEMP "oneagent-contract-home"
          ./scripts/install.ps1 --agent openclaw --check-agent-only --json --home $homeDir

      - name: Wheel builds and runs from a clean install
        run: python scripts/verify_wheel.py

      - name: React unit coverage
        working-directory: frontend
        run: npm run test:coverage

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install chromium

      - name: Browser E2E
        working-directory: frontend
        run: npm run e2e

      - name: Build native macOS onedir
        if: runner.os == 'macOS'
        run: python scripts/build_release.py --channel technical-preview-unsigned --skip-frontend

      - name: Real macOS cleanroom
        if: runner.os == 'macOS'
        env:
          ONEAGENT_PACKAGED_BINARY: ${{ github.workspace }}/build/pyinstaller-dist/OneAgent/OneAgent
        run: bash tests/macos_cleanroom_test.sh

      - name: Validate macOS arm64 release for the public site
        if: matrix.os == 'macos-15'
        run: python scripts/check_release.py release

      - name: Upload verified macOS arm64 release for the public site
        if: matrix.os == 'macos-15'
        uses: actions/upload-artifact@v4
        with:
          name: public-site-release-macos-arm64
          path: release/*
          if-no-files-found: error

      - name: Upload browser failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failures-${{ matrix.os }}
          path: frontend/test-results
          if-no-files-found: ignore

      - name: Upload macOS cleanroom failures
        if: failure() && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: macos-cleanroom-failures-${{ matrix.os }}
          path: build/macos-cleanroom
          if-no-files-found: ignore


  public-site:
    name: Public distribution site
    needs: contract-and-browser
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Download verified macOS arm64 release
        uses: actions/download-artifact@v4
        with:
          name: public-site-release-macos-arm64
          path: release

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install site dependencies
        working-directory: site
        run: npm ci

      - name: Unit, type and release-data checks
        working-directory: site
        run: |
          npm test
          npm run build

      - name: Install Chromium
        working-directory: site
        run: npx playwright install --with-deps chromium

      - name: Browser and accessibility checks
        working-directory: site
        run: npm run test:e2e

      - name: Verify GitHub Pages base path build
        working-directory: site
        env:
          SITE_URL: https://example.com
          BASE_PATH: /OneAgent
        run: npm run build

      - name: Upload site browser failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: public-site-browser-failures
          path: site/test-results
          if-no-files-found: ignore
