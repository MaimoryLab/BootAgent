name: CI

on:
  # Automatic runs are off at the repository owner's request. The jobs below are
  # unchanged and still run on demand from the Actions tab, so restoring
  # continuous checks means putting the pull_request and push triggers back --
  # nothing else here has to change.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  container-cleanroom:
    name: Docker Linux cleanroom
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Build and run isolated Linux cleanroom
        run: bash scripts/test_docker_cleanroom.sh

      - name: Upload cleanroom evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-linux-cleanroom
          path: build/docker-cleanroom
          if-no-files-found: ignore

  contract-and-browser:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: Linux x64
          - os: windows-2022
            label: Windows x64
          - os: macos-15
            label: macOS arm64
          - os: macos-15-intel
            label: macOS x64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache-dependency-path: go.sum

      - name: Verify generated Wails bindings
        if: runner.os == 'Linux'
        run: bash scripts/check_wails_bindings.sh

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # Go gates for the application and release tooling. staticcheck and
      # govulncheck are pinned so a new upstream release cannot change what this
      # job enforces.
      # so a new upstream release cannot change what this job enforces.
      - name: Go vet and contracts
        shell: bash
        run: |
          go vet ./...
          go test ./...
          go test -race ./...

      - name: Go static analysis
        shell: bash
        run: |
          go run honnef.co/go/tools/cmd/staticcheck@2025.1.1 ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

      # scripts/install.sh and .ps1 are pure forwarding layers as of phase 3, so
      # the CLI has to exist before the wrapper contracts run.
      - name: Build the Go CLI
        shell: bash
        run: |
          mkdir -p bin
          if [ "$RUNNER_OS" = "Windows" ]; then
            go build -o bin/oneagent.exe ./cmd/oneagent
          else
            go build -o bin/oneagent ./cmd/oneagent
          fi

      - name: Bash compatibility contracts
        if: runner.os != 'Windows'
        run: bash tests/install_test.sh

      - name: PowerShell wrapper contract
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $homeDir = Join-Path $env:RUNNER_TEMP "oneagent-contract-home"
          ./scripts/install.ps1 --agent openclaw --check-agent-only --json --home $homeDir

      - name: React unit coverage
        working-directory: frontend
        run: npm run test:coverage

      - name: Install Chromium for Wails binding E2E
        if: runner.os == 'Linux'
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Install Linux native smoke dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev xvfb

      - name: Wails server binding E2E
        if: runner.os == 'Linux'
        working-directory: frontend
        run: npm run test:e2e

      - name: Wails native smoke on Linux
        if: runner.os == 'Linux'
        run: |
          go build -tags "wails,production,gtk3" -o bin/oneagent-desktop ./cmd/oneagent-desktop
          xvfb-run --auto-servernum go run ./cmd/oneagent-native-smoke -binary ./bin/oneagent-desktop

      - name: Wails native smoke on macOS
        if: runner.os == 'macOS'
        run: |
          go build -tags "wails,production" -o bin/oneagent-desktop ./cmd/oneagent-desktop
          go run ./cmd/oneagent-native-smoke -binary ./bin/oneagent-desktop

      - name: Build native macOS onedir
        if: runner.os == 'macOS'
        run: go run ./cmd/oneagent-release build --channel technical-preview-unsigned --skip-frontend

      - name: Real macOS cleanroom
        if: runner.os == 'macOS'
        run: bash tests/macos_cleanroom_test.sh

      - name: Upload macOS cleanroom failures
        if: failure() && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: macos-cleanroom-failures-${{ matrix.os }}
          path: build/macos-cleanroom
          if-no-files-found: ignore
