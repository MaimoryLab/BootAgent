name: Technical Preview Packages

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Draft release tag
        required: true
        default: v0.2.0-dev-preview.1
        type: string
      create_draft_release:
        description: Create an immutable draft GitHub prerelease
        required: true
        default: true
        type: boolean
  push:
    tags:
      - "v*-preview*"

permissions:
  contents: write

concurrency:
  group: technical-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: Linux x64
            source: "--source"
          - os: windows-2022
            label: Windows x64
            source: ""
          - os: macos-15
            label: macOS arm64
            source: ""
          - os: macos-15-intel
            label: macOS x64
            source: ""
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install build dependencies
        run: python -m pip install pyinstaller==6.21.0

      - name: Install and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build unsigned onedir package
        shell: bash
        run: python scripts/build_release.py --channel technical-preview-unsigned --skip-frontend ${{ matrix.source }}

      - name: Smoke packaged CLI on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          home_dir="$(mktemp -d)"
          build/pyinstaller-dist/OneAgent/OneAgent --agent openclaw --check-agent-only --json --home "$home_dir"

      - name: Smoke packaged CLI on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $homeDir = Join-Path $env:RUNNER_TEMP "oneagent-package-home"
          ./build/pyinstaller-dist/OneAgent/OneAgent.exe --agent openclaw --check-agent-only --json --home $homeDir

      - name: Real macOS arm64 cleanroom
        if: matrix.os == 'macos-15'
        run: bash tests/macos_cleanroom_test.sh

      - name: Validate release contents
        run: python scripts/check_release.py release

      - name: Upload native release files
        uses: actions/upload-artifact@v4
        with:
          name: OneAgent-${{ matrix.os }}-technical-preview-unsigned
          path: release/*
          if-no-files-found: error

      - name: Upload cleanroom evidence
        if: always() && matrix.os == 'macos-15'
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-cleanroom-evidence
          path: build/macos-cleanroom
          if-no-files-found: ignore

  assemble:
    name: Assemble release
    needs: build
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Download all native release files
        uses: actions/download-artifact@v4
        with:
          pattern: OneAgent-*-technical-preview-unsigned
          path: build/native-release
          merge-multiple: true

      - name: Create immutable draft prerelease
        if: github.event_name == 'push' || inputs.create_draft_release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; bump the tag instead of replacing assets." >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" build/native-release/* \
            --draft \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "OneAgent $RELEASE_TAG" \
            --notes "Unsigned technical preview. Verify platform, architecture and SHA-256 before use."
