name: Technical Preview Packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*-preview*"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: Linux x64
            source: "--source"
          - os: windows-2022
            label: Windows x64
            source: ""
          - os: macos-15
            label: macOS arm64
            source: ""
          - os: macos-15-intel
            label: macOS x64
            source: ""
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install build dependencies
        run: python -m pip install pyinstaller==6.21.0

      - name: Install and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build unsigned onedir package
        shell: bash
        run: python scripts/build_release.py --channel technical-preview-unsigned --skip-frontend ${{ matrix.source }}

      - name: Smoke packaged CLI on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          home_dir="$(mktemp -d)"
          build/pyinstaller-dist/OneAgent/OneAgent --agent openclaw --check-agent-only --json --home "$home_dir"

      - name: Smoke packaged CLI on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $homeDir = Join-Path $env:RUNNER_TEMP "oneagent-package-home"
          ./build/pyinstaller-dist/OneAgent/OneAgent.exe --agent openclaw --check-agent-only --json --home $homeDir

      - name: Validate release contents
        run: python scripts/check_release.py release

      - uses: actions/upload-artifact@v4
        with:
          name: OneAgent-${{ matrix.os }}-technical-preview-unsigned
          path: release/*
          if-no-files-found: error
