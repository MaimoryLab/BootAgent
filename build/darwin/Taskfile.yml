version: '3'

includes:
  common: ../Taskfile.yml

vars:
  BUNDLE_NAME: BootAgent

tasks:
  build:
    summary: Builds the macOS desktop binary (native only, no Docker cross-compilation)
    deps:
      - task: common:go:mod:tidy
      - task: common:build:frontend
        vars:
          DEV:
            ref: .DEV
    preconditions:
      - sh: test "$(uname -s)" = "Darwin"
        msg: "macOS binaries require CGO and must be built on macOS."
    cmds:
      - go build {{.BUILD_FLAGS}} -o "{{.OUTPUT}}" ./cmd/bootagent-desktop
    vars:
      BUILD_FLAGS: '{{if eq .DEV "true"}}-tags wails -buildvcs=false -gcflags=all="-l"{{else}}-tags wails,production -trimpath -buildvcs=false -ldflags="-w -s"{{end}}'
      OUTPUT: '{{.OUTPUT | default (printf "%s/%s" .BIN_DIR .APP_NAME)}}'
    env:
      GOOS: darwin
      CGO_ENABLED: 1
      GOARCH: '{{.ARCH | default ARCH}}'
      CGO_CFLAGS: "-mmacosx-version-min=12.0"
      CGO_LDFLAGS: "-mmacosx-version-min=12.0"
      MACOSX_DEPLOYMENT_TARGET: "12.0"

  build:universal:
    summary: Builds a darwin universal binary (arm64 + amd64)
    deps:
      - task: build
        vars:
          ARCH: amd64
          OUTPUT: '{{.BIN_DIR}}/{{.APP_NAME}}-amd64'
      - task: build
        vars:
          ARCH: arm64
          OUTPUT: '{{.BIN_DIR}}/{{.APP_NAME}}-arm64'
    cmds:
      - lipo -create -output "{{.BIN_DIR}}/{{.APP_NAME}}" "{{.BIN_DIR}}/{{.APP_NAME}}-amd64" "{{.BIN_DIR}}/{{.APP_NAME}}-arm64"
      - rm "{{.BIN_DIR}}/{{.APP_NAME}}-amd64" "{{.BIN_DIR}}/{{.APP_NAME}}-arm64"

  package:
    summary: Packages the application into a `.app` bundle
    deps:
      - task: build
        vars:
          ARCH:
            ref: .ARCH
      - task: common:generate:darwin:icon
    cmds:
      - task: create:app:bundle

  create:app:bundle:
    summary: Creates the macOS `.app` bundle from an existing binary
    platforms: [darwin]
    cmds:
      - mkdir -p "{{.BIN_DIR}}/{{.BUNDLE_NAME}}.app/Contents/MacOS" "{{.BIN_DIR}}/{{.BUNDLE_NAME}}.app/Contents/Resources"
      - cp "{{.BIN_DIR}}/{{.APP_NAME}}" "{{.BIN_DIR}}/{{.BUNDLE_NAME}}.app/Contents/MacOS/{{.APP_NAME}}"
      - cp build/darwin/icons.icns "{{.BIN_DIR}}/{{.BUNDLE_NAME}}.app/Contents/Resources/icons.icns"
      - cp build/darwin/Info.plist "{{.BIN_DIR}}/{{.BUNDLE_NAME}}.app/Contents/Info.plist"
      - codesign --force --deep --sign - "{{.BIN_DIR}}/{{.BUNDLE_NAME}}.app"

  run:
    cmds:
      - '"{{.BIN_DIR}}/{{.APP_NAME}}"'
