version: '3'

tasks:
  go:mod:tidy:
    summary: Runs `go mod tidy`
    internal: true
    # darwin:build:universal runs its per-arch builds as parallel deps; two
    # `go mod tidy` processes racing on go.mod can corrupt it.
    run: once
    cmds:
      - go mod tidy

  install:frontend:deps:
    summary: Install frontend dependencies (pnpm only)
    run: once
    dir: frontend
    sources:
      - package.json
      - pnpm-lock.yaml
    generates:
      - node_modules
    preconditions:
      - sh: pnpm --version
        msg: "pnpm not found. Install it first: https://pnpm.io/installation"
    cmds:
      - pnpm install --frozen-lockfile

  build:frontend:
    summary: Build the React frontend (tsc --noEmit runs as part of the build script)
    # Universal builds run per-arch builds as parallel deps, each depending on
    # this task; without run:once the two executions race on frontend/bindings.
    run: once
    dir: frontend
    sources:
      - "**/*"
      - exclude: node_modules/**/*
    generates:
      - dist/**/*
    deps:
      - task: install:frontend:deps
      - task: generate:bindings
    cmds:
      - pnpm run build
    env:
      PRODUCTION: '{{if eq .DEV "true"}}false{{else}}true{{end}}'

  generate:bindings:
    summary: Regenerate Wails TypeScript bindings with the pinned Wails CLI
    run: once
    deps:
      - task: go:mod:tidy
    sources:
      - "**/*.go"
      - go.mod
      - go.sum
      - exclude: frontend/**/*
    generates:
      - frontend/bindings/**/*
    cmds:
      - '{{.WAILS3}} generate bindings -f "-tags wails" -ts -i -d frontend/bindings ./cmd/bootagent-desktop'

  generate:darwin:icon:
    summary: Generate the macOS application icon
    run: once
    dir: build
    sources:
      - appicon.png
    generates:
      - darwin/icons.icns
    cmds:
      - '{{.WAILS3}} generate icons -input appicon.png -macfilename darwin/icons.icns -windowsfilename ""'

  # windows/icon.ico is tracked rather than generated, so there is deliberately no
  # generate:windows:icon task. `wails3 generate icons` scales every entry from
  # appicon.png, and at 16x16 -- the size Explorer and the taskbar use -- a
  # uniformly scaled ring stroke lands under 2.4px and blends into a solid block,
  # losing the break in the ring. A task that regenerated the file would discard
  # the corrected entry on every `task package`, silently and without failing.
  #
  # The tracked file's six entries (256/128/64/48/32/16) are rendered from the
  # mark's own geometry -- a stroked circle at cx/cy 66/65 r 33 plus a round-capped
  # line from 33,8 to 33,98, on a #211F1B plate, per build/appicon.png -- with the
  # stroke held at the brand's 12 units down to 32px and widened to 18 for the
  # 16x16 entry only. 18 is the point where that entry keeps a 2px ring wall and
  # an open counter; at 12 the wall is 1px and breaks up, and past 20 the ring
  # closes against the stem. The plate's corner radius scales with the entry
  # (28 units at 128 and above, then 14/11/7/4).
  #
  # If the mark changes again, re-render all six with those rules rather than
  # letting one scale factor cover every size.

  dev:frontend:
    summary: Runs the Vite dev server (used by `task dev`)
    deps:
      - task: install:frontend:deps
    dir: frontend
    cmds:
      # Vite 8 binds to [::1] only by default, but the Wails dev asset proxy
      # dials localhost with forced IPv4 — bind 127.0.0.1 so they can meet.
      - pnpm run dev --host 127.0.0.1 --port {{.VITE_PORT}} --strictPort
