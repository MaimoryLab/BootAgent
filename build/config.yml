version: '3'

info:
  companyName: "MaimoryLab"
  productName: "OneAgent"
  productIdentifier: "com.maimorylab.oneagent"
  description: "Local AI development environment activator"
  copyright: "(c) 2026 MaimoryLab"
  version: "0.3.0-dev"

dev_mode:
  root_path: .
  log_level: warn
  debounce: 500
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
    file:
      - .DS_Store
      - .gitkeep
      - .keep
      - "*_test.go"
    watched_extension:
      - "*.go"
    git_ignore: true
  executes:
    # Dev build regenerates bindings and the frontend dist via task deps; the
    # running app itself loads the frontend from the background Vite server.
    - cmd: task build DEV=true
      type: blocking
    - cmd: task common:dev:frontend
      type: background
    - cmd: task run
      type: primary
