version: '3'

includes:
  common: ../Taskfile.yml

tasks:
  build:
    summary: Builds the Windows desktop binary (pure-Go cross-compile works from any host)
    deps:
      - task: common:go:mod:tidy
      - task: common:build:frontend
        vars:
          DEV:
            ref: .DEV
      - task: generate:syso
        vars:
          ARCH: '{{.ARCH | default ARCH}}'
          VERSION: '{{.VERSION}}'
    cmds:
      - go build {{.BUILD_FLAGS}} -o "{{.OUTPUT}}" ./cmd/bootagent-desktop
      # The .syso is a build input for GOOS=windows only. Left in place it would
      # be picked up by a native Windows build of any other target in this repo,
      # and its arch suffix makes it wrong for the other architecture.
      - cmd: powershell Remove-item "cmd/bootagent-desktop/wails_windows_{{.ARCH | default ARCH}}.syso"
        platforms: [windows]
      - cmd: rm -f "cmd/bootagent-desktop/wails_windows_{{.ARCH | default ARCH}}.syso"
        platforms: [linux, darwin]
    vars:
      BUILD_FLAGS: '{{if eq .DEV "true"}}-tags wails -buildvcs=false -gcflags=all="-l"{{else}}-tags wails,production -trimpath -buildvcs=false -ldflags="-w -s -H windowsgui{{if .VERSION}} -X github.com/MaimoryLab/BootAgent/internal/version.Version={{.VERSION}}{{end}}"{{end}}'
      OUTPUT: '{{.OUTPUT | default (printf "%s/%s.exe" .BIN_DIR .APP_NAME)}}'
    env:
      GOOS: windows
      CGO_ENABLED: 0
      GOARCH: '{{.ARCH | default ARCH}}'

  generate:syso:
    summary: Generates Windows resources with the application icon
    dir: '{{.ROOT_DIR}}'
    # No common:generate:windows:icon dep: build/windows/icon.ico is tracked, and
    # regenerating it from appicon.png would replace its hand-drawn 16x16 entry --
    # the size Explorer and the taskbar use, where a scaled copy of the mark
    # collapses into a solid block.
    cmds:
      - cmd: powershell -NoProfile -Command "(Get-Content build/windows/info.json -Raw) -replace '0.0.0','{{.VERSION | default "0.0.0"}}' | Set-Content build/windows/info.generated.json"
        platforms: [windows]
      - cmd: sed 's/0.0.0/{{.VERSION | default "0.0.0"}}/g' build/windows/info.json > build/windows/info.generated.json
        platforms: [linux, darwin]
      - '{{.WAILS3}} generate syso -arch {{.ARCH | default ARCH}} -icon build/windows/icon.ico -manifest build/windows/wails.exe.manifest -info build/windows/info.generated.json -out cmd/bootagent-desktop/wails_windows_{{.ARCH | default ARCH}}.syso'
      - cmd: powershell Remove-item "build/windows/info.generated.json"
        platforms: [windows]
      - cmd: unlink build/windows/info.generated.json
        platforms: [linux, darwin]
    env:
      # The generator runs on the host; GOARCH may be the cross-compile target.
      GOARCH: amd64

  package:
    summary: Builds an NSIS installer
    dir: build/windows/nsis
    deps:
      - task: build
        vars:
          ARCH: '{{.ARCH}}'
          VERSION: '{{.VERSION}}'
      # nsis/project.nsi reads the tracked ../icon.ico directly through MUI_ICON,
      # so the installer needs no icon-generation step of its own.
    preconditions:
      - sh: command -v makensis >/dev/null 2>&1
        msg: "makensis not found. Install NSIS first."
      - sh: '[ "{{.INSTALL_SCOPE}}" = "user" ] || [ "{{.INSTALL_SCOPE}}" = "machine" ]'
        msg: "INSTALL_SCOPE must be 'user' or 'machine'."
      - sh: echo '{{.VERSION}}' | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
        msg: "VERSION must match X.Y.Z."
    cmds:
      - cmd: '{{.WAILS3}} generate webview2bootstrapper -dir "{{.ROOT_DIR}}/build/windows/nsis"'
        env:
          GOARCH: amd64
      - |
        {{if eq OS "windows"}}
        makensis -DINFO_PRODUCTVERSION={{.VERSION}} {{if eq .INSTALL_SCOPE "user"}}-DWAILS_INSTALL_SCOPE=user -DREQUEST_EXECUTION_LEVEL=user {{end}}-DARG_WAILS_{{.ARG_FLAG}}_BINARY="{{.ROOT_DIR}}\{{.BIN_DIR}}\{{.APP_NAME}}.exe" project.nsi
        {{else}}
        makensis -DINFO_PRODUCTVERSION={{.VERSION}} {{if eq .INSTALL_SCOPE "user"}}-DWAILS_INSTALL_SCOPE=user -DREQUEST_EXECUTION_LEVEL=user {{end}}-DARG_WAILS_{{.ARG_FLAG}}_BINARY="{{.ROOT_DIR}}/{{.BIN_DIR}}/{{.APP_NAME}}.exe" project.nsi
        {{end}}
    vars:
      ARCH: '{{.ARCH | default ARCH}}'
      ARG_FLAG: '{{if eq .ARCH "amd64"}}AMD64{{else}}ARM64{{end}}'
      INSTALL_SCOPE: '{{.INSTALL_SCOPE | default "machine"}}'
      VERSION: '{{.VERSION | default "0.0.0"}}'

  run:
    cmds:
      - '"{{.BIN_DIR}}/{{.APP_NAME}}.exe"'
