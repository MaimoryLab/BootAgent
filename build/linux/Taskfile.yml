version: '3'

includes:
  common: ../Taskfile.yml

tasks:
  build:
    summary: Builds the Linux desktop binary (native only, no Docker cross-compilation)
    deps:
      - task: common:go:mod:tidy
      - task: common:build:frontend
        vars:
          DEV:
            ref: .DEV
    preconditions:
      - sh: test "$(uname -s)" = "Linux"
        msg: "Linux binaries require CGO (WebKitGTK) and must be built on Linux."
    cmds:
      - go build {{.BUILD_FLAGS}} -o "{{.OUTPUT}}" ./cmd/oneagent-desktop
    vars:
      BUILD_FLAGS: '{{if eq .DEV "true"}}-tags wails -buildvcs=false -gcflags=all="-l"{{else}}-tags wails,production -trimpath -buildvcs=false -ldflags="-w -s"{{end}}'
      OUTPUT: '{{.OUTPUT | default (printf "%s/%s" .BIN_DIR .APP_NAME)}}'
    env:
      GOOS: linux
      CGO_ENABLED: 1
      GOARCH: '{{.ARCH | default ARCH}}'

  run:
    cmds:
      - '"{{.BIN_DIR}}/{{.APP_NAME}}"'
