version: '3'

vars:
  APP_NAME: bootagent-desktop
  BIN_DIR: bin
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  # Target OS for build/run. Defaults to the host OS; override with GOOS=... to
  # cross-compile (only windows supports cross-compilation, see build/*/Taskfile.yml).
  GOOS: '{{.GOOS | default OS}}'
  WAILS_MODULE: github.com/wailsapp/wails/v3
  WAILS_VERSION: v3.0.0-beta.7
  # Pinned Wails CLI (see build/tool-versions.env); never rely on a global wails3.
  WAILS3: go run {{.WAILS_MODULE}}/cmd/wails3@{{.WAILS_VERSION}}

includes:
  common: ./build/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml
  windows: ./build/windows/Taskfile.yml

tasks:
  build:
    summary: Builds the desktop application for {{.GOOS}}
    cmds:
      - task: '{{.GOOS}}:build'
        vars:
          ARCH: '{{.ARCH}}'
          DEV: '{{.DEV}}'
          OUTPUT: '{{.OUTPUT}}'

  package:
    summary: Packages a production build for {{.GOOS}}
    cmds:
      - task: '{{.GOOS}}:package'
        vars:
          ARCH: '{{.ARCH}}'
          INSTALL_SCOPE: '{{.INSTALL_SCOPE}}'
          VERSION: '{{.VERSION}}'

  run:
    summary: Runs the built desktop application
    cmds:
      - task: '{{.GOOS}}:run'

  dev:
    summary: Runs the application in development mode (vite HMR + Go rebuild on change)
    cmds:
      - '{{.WAILS3}} dev -config ./build/config.yml -port {{.VITE_PORT}}'

  test:go:
    summary: Run Go backend tests
    cmds:
      - go test ./...

  generate:bindings:
    summary: Regenerate Wails TypeScript bindings
    cmds:
      - task: common:generate:bindings

  build:frontend:
    summary: Build the React frontend
    cmds:
      - task: common:build:frontend

  build:desktop:
    summary: Build the production Wails desktop binary for the host OS
    cmds:
      - task: build

  test:e2e:
    summary: Run the Wails server binding browser test
    deps:
      - build:frontend
    cmds:
      - cd frontend && pnpm run test:e2e
